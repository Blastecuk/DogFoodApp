name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Build must not require production/provider secrets.
          DATABASE_URL: postgresql://user:pass@localhost:5432/payload_db
          PAYLOAD_SECRET: ci-placeholder-secret
          COMMERCE_DATABASE_URL: postgresql://user:pass@localhost:5432/commerce_db
          BETTER_AUTH_SECRET: ci-placeholder-secret
